<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Nitro Rush</title>
<style>

[hidden]{display:none!important}
#app{position:relative;width:100%;height:100%;touch-action:none;overflow:hidden}

.ov{position:absolute;inset:0;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#000b 100%);opacity:.3}
.ov button,.pn{pointer-events:auto}
button{font:inherit;font-weight:800;color:#fff;border:0;cursor:pointer;text-shadow:0 2px 4px #0008;-webkit-tap-highlight-color:transparent}
.or{background:linear-gradient(#ff9a3c,#f26b0f)}.bl{background:linear-gradient(#2f80e8,#1757b0)}
.top{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;font-weight:800;font-size:18px}
.chip{background:#14161ccc;padding:7px 12px;border-radius:6px;font-style:italic;text-shadow:0 2px 6px #000a}
#cn{position:absolute;top:54px;left:0;right:0;text-align:center;font-size:clamp(26px,8vw,44px);font-weight:900;font-style:italic;letter-spacing:2px;text-shadow:0 3px 10px #000a}
.arr{position:absolute;top:50%;width:50px;height:50px;margin-top:-25px;border-radius:50%;font-size:30px;background:#14161caa;padding:0}
#pv{left:8px}#nx{right:8px}
#bars{position:absolute;right:10px;top:104px;width:140px;background:#14161c99;padding:8px 10px;border-radius:6px}
.r span{font-size:11px;font-weight:800;font-style:italic}
.r b{display:block;height:7px;margin:2px 0 6px;background:#fff3;border-radius:3px;overflow:hidden}
.r i{display:block;height:100%;background:#3ddc84}
.bot{position:absolute;left:10px;right:10px;bottom:12px;display:flex;gap:10px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
#sw{display:flex;gap:6px;flex-wrap:wrap;max-width:200px}
#sw button{width:28px;height:28px;border-radius:50%;border:2px solid #fff5;padding:0}
#sw button.on{border-color:#fff;transform:scale(1.25)}
.md{display:flex;flex-direction:column;gap:6px}
.md button{padding:8px 14px;border-radius:5px;background:#14161caa;font-size:13px}
.md button.on{background:linear-gradient(#2f80e8,#1757b0)}
#play{padding:14px 34px;font-size:22px;font-style:italic;border-radius:4px}
#exit{position:absolute;left:10px;top:56px;padding:8px 12px;border-radius:5px;font-size:13px}
#nit{position:absolute;right:14px;bottom:22px;width:94px;height:94px;border-radius:50%;font-size:15px;font-style:italic;box-shadow:0 0 0 4px #fff4}
#nit span{display:block;height:6px;width:60px;margin:6px auto 0;background:#0006;border-radius:3px;overflow:hidden}
#nb{display:block;height:100%;background:#fff}
.box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#0b0d12ea;padding:22px 26px;border-radius:10px;text-align:center;min-width:240px}
.box h1{margin:0 0 8px;color:#ffd23f;font-style:italic}.box p{margin:6px 0}
.box button{margin:8px 4px 0;padding:12px 22px;border-radius:5px}
</style>
</head>
<body>
<div id="app">
  <div id="vig"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(() => {
const $ = id => document.getElementById(id);

// ---- data / save ----
const CARS = [

  {n: 'FUTURE', file: 'race-future', p: 600, sp: 78, br: 62, st: 72, ni: 70, rim: 0xff2a2a, len: 4.2, wing: 1},
  {n: 'SPORT SEDAN', file: 'sedan-sports', p: 1000, sp: 85, br: 70, st: 76, ni: 78, rim: 0x222222, len: 4.2, wing: 0},

const PAINT = [0xe63946, 0x1e90ff, 0xffc300, 0x2ecc71, 0x9b5de5, 0xffffff, 0x20242b, 0xff7a00];
const COL = [0x457b9d, 0xf4a261, 0x2a9d8f, 0xe9c46a, 0x9b5de5, 0xffffff, 0x6c757d];
let S = {d: 300, s: 0, best: 0, own: [0], car: 0, col: [0, 1, 2], mode: 'hwy'};
try { Object.assign(S, JSON.parse(localStorage.getItem('nr2') || '{}')); } catch (e) {}
while (S.col.length < CARS.length) S.col.push(S.col.length);
if (!CARS[S.car]) S.car = 0;
const save = () => { try { localStorage.setItem('nr2', JSON.stringify(S)); } catch (e) {} };

// ---- renderer / scene ----
const R = new THREE.WebGLRenderer({antialias: true});
R.setPixelRatio(Math.min(devicePixelRatio || 1, 2));

R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.2;
app.insertBefore(R.domElement, app.firstChild);
const scene = new THREE.Scene(), SKY = 0xcfe8ff, DARK = new THREE.Color(0x15171c);
scene.fog = new THREE.Fog(SKY, 50, 190);
const cam = new THREE.PerspectiveCamera(60, 1, 0.1, 500);
const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x55704a, 0.85);
const sun = new THREE.DirectionalLight(0xfff2d6, 0.9);

const L = c => new THREE.MeshLambertMaterial({color: c});

  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const skyT = canvasTex(2, 256, x => {
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#2c6fc9'); g.addColorStop(0.35, '#5aa2ea'); g.addColorStop(0.62, '#b9dcfb'); g.addColorStop(0.72, '#cfe8ff'); g.addColorStop(1, '#cfe8ff');
  x.fillStyle = g; x.fillRect(0, 0, 2, 256);

// ---- reflections: procedural studio-sky environment ----
let envTex;
{
  const envS = new THREE.Scene(), panel = new THREE.MeshBasicMaterial({color: 0xffffff});
  envS.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), new THREE.MeshBasicMaterial({map: skyT, side: THREE.BackSide})));
  [[0, 30, 0, 30, 1, 30], [-35, 10, 0, 1, 12, 30], [35, 10, 0, 1, 12, 30]].forEach(a => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(a[3], a[4], a[5]), panel); m.position.set(a[0], a[1], a[2]); envS.add(m);
  });
  try { envTex = new THREE.PMREMGenerator(R).fromScene(envS).texture; } catch (e) { envTex = null; }
}
// ---- ground / sky ----
const gT = noiseTex('#3f9a3f', '#2a6e2a', 400); gT.repeat.set(20, 20);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({map: gT}));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grd = (gx, gz, d) => gT.offset.set(gx / 20, -gz / 20 + d / 20);
const CL = new THREE.Group(); scene.add(CL);
const cloudM = new THREE.MeshLambertMaterial({color: 0xffffff, emissive: 0x9db4d0, transparent: true, opacity: 0.93}), sphG = new THREE.SphereGeometry(1, 10, 8);
for (let i = 0; i < 12; i++) {
  const c = new THREE.Group(), a = rnd(0, 6.28), r = rnd(90, 170);
  for (let j = 0; j < 4; j++) { const s = new THREE.Mesh(sphG, cloudM); s.scale.set(rnd(6, 10), rnd(2, 3), rnd(3, 5)); s.position.set(j * 6 - 9, rnd(-1, 1), rnd(-2, 2)); c.add(s); }
  c.position.set(Math.cos(a) * r, rnd(55, 80), Math.sin(a) * r); CL.add(c);
}

// ---- car model ----
const GC = {}, wg = new THREE.CylinderGeometry(0.42, 0.42, 0.34, 16), rg = new THREE.CylinderGeometry(0.27, 0.27, 0.36, 12);
const FG = new THREE.ConeGeometry(0.2, 1.4, 8).translate(0, 0.7, 0).rotateX(Math.PI / 2);
const lampG = new THREE.BoxGeometry(0.4, 0.14, 0.06), tireM = L(0x111111);
const grG = new THREE.BoxGeometry(1.0, 0.16, 0.06), spG = new THREE.BoxGeometry(0.5, 0.37, 0.05), splG = new THREE.BoxGeometry(1.7, 0.08, 0.5);
const plG = new THREE.BoxGeometry(0.4, 0.14, 0.02), miG = new THREE.BoxGeometry(0.22, 0.12, 0.12), exG = new THREE.CylinderGeometry(0.06, 0.06, 0.3, 8).rotateX(Math.PI / 2);
const ugG = new THREE.PlaneGeometry(3, 6.2).rotateX(-Math.PI / 2);
const ugM = new THREE.MeshBasicMaterial({map: canvasTex(64, 64, x => {
  const g = x.createRadialGradient(32, 32, 2, 32, 32, 32); g.addColorStop(0, 'rgba(60,200,255,.9)'); g.addColorStop(1, 'rgba(60,200,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
}), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false});
const radial = (rgb, a) => canvasTex(64, 64, x => {
  const g = x.createRadialGradient(32, 32, 1, 32, 32, 32); g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')'); g.addColorStop(1, 'rgba(' + rgb + ',0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
});
const ctG = new THREE.PlaneGeometry(2.6, 5.4).rotateX(-Math.PI / 2), ctM = new THREE.MeshBasicMaterial({map: radial('0,0,0', 0.6), transparent: true, depthWrite: false});
const haloG = new THREE.PlaneGeometry(1, 1), haloM = new THREE.MeshBasicMaterial({map: radial('255,40,30', 1), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false});
const lampSpr = new THREE.SpriteMaterial({map: radial('255,235,170', 1), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false});
const headM = new THREE.MeshBasicMaterial({color: 0xfff6c8}), tailM = new THREE.MeshBasicMaterial({color: 0xff2020});
const flameM = new THREE.MeshBasicMaterial({color: 0xffa31a, transparent: true, opacity: 0.85});
function extr(pts, depth, bev) {
  const s = new THREE.Shape();
  pts.forEach((p, i) => i ? s.lineTo(p[0], p[1]) : s.moveTo(p[0], p[1]));
  const g = new THREE.ExtrudeGeometry(s, {depth, bevelEnabled: true, bevelThickness: bev, bevelSize: bev, bevelSegments: 3, steps: 1});
  g.rotateY(Math.PI / 2); g.translate(-depth / 2, 0, 0); return g;
}
function makeProcCar(idx, col, glow) {
  const d = CARS[idx], h = d.len / 2, W = 1.5, g = new THREE.Group(), b = new THREE.Group(); g.add(b);
  const geo = GC[idx] || (GC[idx] = {
    body: extr([[-h, 0.35], [h, 0.35], [h, 0.62], [h * 0.55, 0.82], [-h * 0.1, 0.9], [-h, 0.78]], W, 0.14),
    cab: extr([[-0.9, 0], [0.9, 0], [0.45, 0.52], [-0.55, 0.52]], W - 0.35, 0.1)});
  const paint = PC(col); b.add(new THREE.Mesh(geo.body, paint));
  const glassM = P(0x0c1118, 0.95, 0.05); glassM.envMapIntensity = 1.8; const cab = new THREE.Mesh(geo.cab, glassM); cab.position.set(0, 0.88, 0.35); b.add(cab);
  const rimM = P(d.rim, 1, 0.2);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const w = new THREE.Group(); w.add(new THREE.Mesh(wg, tireM), new THREE.Mesh(rg, rimM));
    for (let k = 0; k < 3; k++) { const s = new THREE.Mesh(spG, rimM); s.rotation.y = k * Math.PI / 3; w.add(s); }
    w.rotation.z = Math.PI / 2; w.position.set(sx * (W / 2 + 0.12), 0.42, sz * h * 0.62); b.add(w);
  }
  for (const sx of [-0.5, 0.5]) {
    const hl = new THREE.Mesh(lampG, headM); hl.position.set(sx, 0.6, -h - 0.15); b.add(hl);
    const tl = new THREE.Mesh(lampG, tailM); tl.position.set(sx * 1.1, 0.7, h + 0.15); b.add(tl);
  }
  const blk = P(0x0b0c0f, 0.5, 0.5), add = (geo2, mat2, x, y, z) => { const m = new THREE.Mesh(geo2, mat2); m.position.set(x, y, z); b.add(m); };
  add(grG, blk, 0, 0.5, -h - 0.16); add(splG, blk, 0, 0.3, -h - 0.05); add(plG, P(0xffffff, 0, 0.6), 0, 0.55, h + 0.16);
  for (const sx of [-1, 1]) { add(miG, paint, sx * 1.0, 1.0, -0.55); add(exG, P(0xb8bcc4, 1, 0.2), sx * 0.45, 0.4, h + 0.25); }
  const ct = new THREE.Mesh(ctG, ctM); ct.position.y = 0.03; g.add(ct);
  for (const sx of [-0.55, 0.55]) { const hl = new THREE.Mesh(haloG, haloM); hl.scale.set(1.1, 0.7, 1); hl.position.set(sx, 0.7, h + 0.22); g.add(hl); }
  if (glow) { const u = new THREE.Mesh(ugG, ugM); u.position.y = 0.05; g.add(u); }
  if (d.wing) {
    const dk = P(0x15171c, 0.4, 0.4), wing = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.07, 0.5), dk); wing.position.set(0, 1.15, h - 0.05); b.add(wing);
    for (const sx of [-0.6, 0.6]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.3, 0.08), dk); p.position.set(sx, 0.97, h - 0.05); b.add(p); }
  }
  g.refl = b.clone(); g.refl.scale.y = -1; g.refl.visible = false; g.add(g.refl);
  b.traverse(m => { if (m.isMesh) m.castShadow = true; });
  g.fl = [-0.5, 0.5].map(sx => { const f = new THREE.Mesh(FG, flameM); f.position.set(sx, 0.55, h + 0.2); f.visible = false; g.add(f); return f; });
  return g;
}
// ---- Kenney Car Kit models (.glb files next to index.html); falls back to the built-in cars ----
const FLIP = true; // if the cars drive backwards, change this to false
const FILES = ['race', 'race-future', 'sedan-sports', 'hatchback-sports', 'taxi', 'sedan', 'suv', 'van', 'truck', 'ambulance'];
const TRAF = ['taxi', 'sedan', 'suv', 'van', 'truck', 'ambulance'], MODELS = {};
const pickT = () => { const a = TRAF.filter(n => MODELS[n]); return a.length ? a[Math.floor(Math.random() * a.length)] : 'none'; };
function makeCar(idx, col, glow, tName) {

  if (!tpl) return makeProcCar(idx, col, glow);

  const m = tpl.clone(true); b.add(m);
  if (!tName) m.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); if (/paint|body/i.test(o.material.name)) o.material.color.setHex(col); } });
  g.refl = b.clone(); g.refl.scale.y = -1; g.refl.visible = false; g.add(g.refl);
  b.traverse(o => { if (o.isMesh) o.castShadow = true; });
  const ct = new THREE.Mesh(ctG, ctM); ct.position.y = 0.03; g.add(ct);
  if (glow) { const u = new THREE.Mesh(ugG, ugM); u.position.y = 0.05; g.add(u); }
  g.fl = [-0.5, 0.5].map(sx => { const f = new THREE.Mesh(FG, flameM); f.position.set(sx, 0.55, h + 0.2); f.visible = false; g.add(f); return f; });
  return g;

if (THREE.GLTFLoader) {

    const sc = gl.scene, sz = new THREE.Box3().setFromObject(sc).getSize(new THREE.Vector3());

}
let car;
function setCar() {

  if (car) scene.remove(car);
  car = makeCar(S.car, PAINT[S.col[S.car]], true); car.rotation.y = ry; car.refl.visible = state === 'garage'; scene.add(car);

// ---- garage ----
const G = new THREE.Group(); scene.add(G);
const tile = canvasTex(256, 256, x => {

floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; G.add(floor);
const wallT = noiseTex('#70747a', '#4a4d52', 500); wallT.repeat.set(4, 2);
const wallM = new THREE.MeshStandardMaterial({map: wallT, roughness: 0.9});
[[0, -12, 0], [-12, 0, Math.PI / 2], [12, 0, -Math.PI / 2]].forEach(([x, z, r]) => {
  const w = new THREE.Mesh(new THREE.PlaneGeometry(30, 12), wallM); w.position.set(x, 6, z); w.rotation.y = r; w.receiveShadow = true; G.add(w);
});
const prop = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; G.add(m); return m; };
prop(new THREE.BoxGeometry(30, 0.9, 0.05), new THREE.MeshBasicMaterial({color: 0x1f5fbf}), 0, 3, -11.95);
const yel = P(0xe0a800, 0.3, 0.6);
prop(new THREE.BoxGeometry(0.3, 6, 0.3), yel, 6.5, 3, -8); prop(new THREE.BoxGeometry(0.3, 6, 0.3), yel, 9.5, 3, -8);

  if (play) { bs = hw ? Math.min(60 + d.sp * 0.3, bs + 0.8 * dt) : 38; speed += (bs + (nOn ? 28 : 0) - speed) * Math.min(1, dt * 2); }

      if (t.sw > 0) {
        t.sw -= dt; if (t.sw <= 0 && m.position.z < -40) { t.lane = clamp(t.lane + (Math.random() < 0.5 ? -1 : 1), 0, 2); t.sw = rnd(2, 5); }
        const dx = LANES[t.lane] - m.position.x; m.position.x += dx * Math.min(1, dt * 3); m.rotation.y = -dx * 0.08;
      }
      if (m.position.z > 15 || m.position.z < -250) { scene.remove(m); traffic.splice(i, 1); }
    }
    if (play) {
      vx += (st * (8 + d.st * 0.1) - vx) * Math.min(1, dt * 10); px += vx * dt;
      if (Math.abs(px) > 5.1) { px = clamp(px, -5.1, 5.1); vx = 0; }
      dist += sv; spawnT -= dt;
      if (spawnT <= 0) { spawn(); spawnT = rnd(0.7, 1.4) * Math.max(0.45, 40 / speed); }
      for (const t of traffic) if (Math.abs(t.mesh.position.x - px) < 1.6 && Math.abs(t.mesh.position.z) < 3.8) { crash(); break; }
    }
    car.position.set(px, 0, 0); car.rotation.y = -vx * 0.025;
    ground.position.set(0, -0.02, -100); grd(0, -100, scr);
    sc.textContent = Math.floor(dist) + ' m';
  } else {
    ang -= st * (1.1 + d.st * 0.012) * dt * clamp(speed / 22, 0.35, 1.2);
    cx -= Math.sin(ang) * sv; cz -= Math.cos(ang) * sv; dist += sv;
    for (const k of blocks) {
      const p = k.position; p.x = wr(p.x, cx); p.z = wr(p.z, cz);
      for (const b of k.children) {
        const bx = p.x + b.position.x, bz = p.z + b.position.z;
        const qx = clamp(cx, bx - b.hw, bx + b.hw), qz = clamp(cz, bz - b.hd, bz + b.hd), dx = cx - qx, dz = cz - qz, q = dx * dx + dz * dz;
        if (q < 2.6) { const l = Math.sqrt(q) || 1; cx = qx + dx / l * 1.6; cz = qz + dz / l * 1.6; speed *= Math.max(0, 1 - 6 * dt); }
      }
    }
    gems.forEach((g, i) => {
      const p = g.position; p.x = wr(p.x, cx); p.z = wr(p.z, cz); p.y = 1.1 + Math.sin(tt * 3 + i) * 0.3; g.rotation.y += dt * 2;
      if (Math.hypot(p.x - cx, p.z - cz) < 3) { S.d++; earned++; save(); roadPos(p); }
    });
    cityActors(dt);
    MT.position.set(cx, 0, cz);
    car.position.set(cx, 0, cz); car.rotation.y = ang;
    ground.position.set(cx, -0.02, cz); cityT.offset.set(cx / 40, -cz / 40);
    sc.textContent = Math.floor(dist) + ' m  \u25C6 ' + earned;
  }
  spd.textContent = Math.round(speed * 3.6) + ' km/h';
  const cp = car.position; sun.target.position.copy(cp); sun.position.set(cp.x - 12, 22, cp.z + 9);
}

function resize() { const w = app.clientWidth, h = app.clientHeight; R.setSize(w, h); cam.aspect = w / h; }
addEventListener('resize', resize);
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now; update(dt);
  const por = cam.aspect < 1;
  if (state === 'garage') {
    const k = por ? 1.55 : 1; cam.fov = 42; cam.position.set(5.6 * k, 2.3 * k, 6.8 * k); cam.lookAt(0, 0.8, 0);
  } else {
    const nOn = state === 'play' && boost && nitro > 0;
    fv += ((por ? 72 : 58) + speed * 0.15 + (nOn ? 9 : 0) - fv) * Math.min(1, dt * 5); cam.fov = fv;
    let lx, lz, ly = 1;
    if (mode === 'hwy') { cam.position.set(px * 0.6, por ? 5.2 : 4.2, por ? 11 : 9); lx = px * 0.3; lz = -14; }
    else {
      ca += (ang - ca) * Math.min(1, dt * 4); const dd = por ? 11 : 9;
      cam.position.set(cx + Math.sin(ca) * dd, por ? 5.2 : 4.2, cz + Math.cos(ca) * dd); lx = cx - Math.sin(ca) * 12; lz = cz - Math.cos(ca) * 12;
    }
    if (shake > 0) { shake -= dt; cam.position.x += rnd(-1, 1) * shake; cam.position.y += rnd(-1, 1) * shake; }
    cam.lookAt(lx, ly, lz);
  }
  cam.updateProjectionMatrix();
  streaks(dt); CL.position.set(cam.position.x, 0, cam.position.z); CL.rotation.y += dt * 0.004;
  R.render(scene, cam); requestAnimationFrame(loop);
}
resize(); setCar(); toGarage(); requestAnimationFrame(loop);
})();
</script>
